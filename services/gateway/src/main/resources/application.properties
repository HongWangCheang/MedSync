server.address=127.0.0.1
server.port=${MEDTRACK_SYNC_PORT:8081}
spring.datasource.url=${MEDTRACK_SYNC_DB_URL:jdbc:mysql://127.0.0.1:3307/medtrack_sync?sslMode=DISABLED&allowPublicKeyRetrieval=true}
spring.datasource.username=${MEDTRACK_SYNC_DB_USER:medtrack}
spring.datasource.password=${MEDTRACK_SYNC_DB_PASSWORD}
spring.sql.init.mode=always
server.error.include-message=never
mybatis.mapper-locations=classpath:mapper/*.xml
spring.data.redis.host=${MEDTRACK_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${MEDTRACK_REDIS_PORT:6379}
# Fail fast so a Redis outage degrades to MySQL lookups instead of stalling requests.
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
medtrack.rate-limit.requests-per-minute=${MEDTRACK_RATE_LIMIT:120}
medtrack.rate-limit.logins-per-minute=${MEDTRACK_LOGIN_LIMIT:10}
# MedSync: the agent service. In Compose this points at the Toxiproxy hop so faults can be injected between the
# gateway and the agent.
medsync.agent.url=${MEDSYNC_AGENT_URL:http://127.0.0.1:8000}
medsync.agent.connect-timeout=${MEDSYNC_AGENT_CONNECT_TIMEOUT:2s}
medsync.agent.read-timeout=${MEDSYNC_AGENT_READ_TIMEOUT:20s}
